<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
      .text { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 72px; fill: #000; }
      .shadow { fill: #000; }
      .base { fill: #FFFDF9; stroke: #000; stroke-width: 18; stroke-linejoin: round; }
      .accent { fill: #FFB000; stroke: #000; stroke-width: 18; stroke-linejoin: round; }
      .line { fill: none; stroke: #000; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Offset Shadow for Cup Base -->
  <path class="shadow" d="M 140 180 h 230 v 140 c 0 50 -40 90 -90 90 h -50 c -50 0 -90 -40 -90 -90 z" />
  
  <!-- Main Cup Base -->
  <path class="base" d="M 120 160 h 230 v 140 c 0 50 -40 90 -90 90 h -50 c -50 0 -90 -40 -90 -90 z" />

  <!-- Cup Handle Outline & Shadow -->
  <path class="line" d="M 350 200 h 40 c 40 0 40 80 0 80 h -40" />
  <path class="shadow" d="M 350 218 h 40 c 25 0 25 45 0 45 h -40" stroke="#000" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- LaTeX Syntax Inside the Cup: \ and } -->
  <line class="line" x1="180" y1="210" x2="210" y2="290" />
  <path class="line" d="M 270 210 c 20 0 20 40 40 40 c -20 0 -20 40 -40 40" />

  <!-- Stylized Steam / Abstract Quotes -->
  <path class="accent" d="M 170 100 h 30 v -40 h -30 z" />
  <path class="accent" d="M 230 80 h 20 v -30 h -20 z" />

  <!-- App Name -->
  <text x="256" y="475" class="text" text-anchor="middle">llatte</text>
</svg>
